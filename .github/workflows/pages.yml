name: Tests und Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # p2panda-Kandidat: Rust 1.96 mit wasm32-Ziel und wasm-bindgen-cli
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/p2panda-wasm
            rust/beekem-wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: sh scripts/build-wasm.sh
        env:
          RUST_TOOLCHAIN: '1.96'
      - name: Rust-Tests der Hüllen (u. a. die beiden p2panda-Befunde, KV1–KV6)
        run: |
          cargo +1.96 test --manifest-path rust/p2panda-wasm/Cargo.toml --test peer
          cargo +1.96 test --manifest-path rust/beekem-wasm/Cargo.toml
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Subduction-Server für den Keyhive-Lauf a (ARK)
        run: sh scripts/fetch-subduction.sh
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_BUILD: ${{ github.sha }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
