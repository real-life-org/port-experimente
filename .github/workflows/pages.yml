name: Tests und Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ein PR, der nur die Alltags-Experimente (src/lab/alltag, tests/alltag-*)
  # oder Markdown anfasst, lässt nur deren Tests laufen. Alles andere, jeder
  # Push auf main und jeder Handstart laufen voll.
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      k2: ${{ steps.scope.outputs.k2 }}
      ark: ${{ steps.scope.outputs.ark }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          full=true; k2=true; ark=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$BASE"...HEAD)
            other=$(echo "$files" | grep -Ev '^(src/lab/alltag/|tests/alltag-[^/]*\.test\.ts$|tsconfig\.alltag\.json$|.*\.md$)' || true)
            if [ -z "$other" ]; then full=false; else echo "voller Lauf wegen:"; echo "$other"; fi
            # Zwei Dateien laufen je rund zehn Minuten. Sie laufen im PR nur, wenn
            # ihr Experiment oder etwas Gemeinsames angefasst ist.
            shared='^(package\.json|pnpm-lock\.yaml|\.github/|vite\.config\.ts|tsconfig\.json|scripts/|rust/|src/lab/[^/]*\.ts$|src/candidates/[^/]*\.ts$)'
            echo "$other" | grep -Eq "$shared|^src/(lab|candidates)/mehrgeraet|^tests/mehrgeraet-" || k2=false
            echo "$other" | grep -Eq "$shared|^src/candidates/keyhive|^tests/keyhive-" || ark=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "k2=$k2" >> "$GITHUB_OUTPUT"
          echo "ark=$ark" >> "$GITHUB_OUTPUT"

  # Die Alltags-Experimente brauchen weder Rust noch WASM noch einen Server.
  alltag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.alltag.json
      - run: pnpm exec vitest run tests/alltag- --passWithNoTests

  # WASM-Hüllen einmal bauen und ihre Rust-Tests laufen lassen; die
  # Testscheiben und der Build holen die Pakete als Artefakt.
  wasm:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # p2panda-Kandidat: Rust 1.96 mit wasm32-Ziel und wasm-bindgen-cli
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/p2panda-wasm
            rust/beekem-wasm
            rust/mls-wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: sh scripts/build-wasm.sh
        env:
          RUST_TOOLCHAIN: '1.96'
      - name: Rust-Tests der Hüllen (u. a. die beiden p2panda-Befunde, KV1–KV6)
        run: |
          cargo +1.96 test --manifest-path rust/p2panda-wasm/Cargo.toml --test peer
          cargo +1.96 test --manifest-path rust/beekem-wasm/Cargo.toml
          cargo +1.96 test --manifest-path rust/mls-wasm/Cargo.toml --test peer
          cargo +1.96 build --manifest-path rust/mls-wasm/Cargo.toml --example vectors
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          retention-days: 1
          path: |
            src/candidates/p2panda/pkg
            src/candidates/rltp-beekem/pkg
            src/candidates/rltp-mls/pkg

  # Die Testdateien in vier Scheiben nebeneinander (vitest --shard), ohne
  # die zwei langen Dateien; die laufen als eigene Jobs (test-lang).
  test:
    needs: wasm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: src/candidates
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Subduction-Server für den Keyhive-Lauf a (ARK)
        run: sh scripts/fetch-subduction.sh
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/4 --exclude tests/mehrgeraet-k2.test.ts --exclude tests/keyhive-ark.test.ts

  test-lang:
    needs: [changes, wasm]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: tests/mehrgeraet-k2.test.ts
            run: ${{ needs.changes.outputs.k2 }}
          - file: tests/keyhive-ark.test.ts
            run: ${{ needs.changes.outputs.ark }}
    steps:
      - if: matrix.run != 'true'
        run: echo "übersprungen, das Experiment ist in diesem PR nicht angefasst"
      - if: matrix.run == 'true'
        uses: actions/checkout@v4
      - if: matrix.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: src/candidates
      - if: matrix.run == 'true'
        uses: pnpm/action-setup@v4
      - if: matrix.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: matrix.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Subduction-Server für den Keyhive-Lauf a (ARK)
        if: matrix.run == 'true'
        run: sh scripts/fetch-subduction.sh
      - if: matrix.run == 'true'
        run: pnpm exec vitest run ${{ matrix.file }}

  build:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: src/candidates
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_BUILD: ${{ github.sha }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Ein Check für den Branch-Schutz: grün, wenn nichts gescheitert ist
  # (übersprungene Jobs eines Alltags-PRs zählen nicht als Fehler).
  ci:
    if: always()
    needs: [changes, alltag, wasm, test, test-lang, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, test, test-lang, alltag]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
