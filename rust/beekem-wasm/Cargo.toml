[package]
name = "beekem-wasm"
version = "0.0.0"
edition = "2024"
publish = false
description = "Prüfstand-Hülle: BeeKEM 0.4.0 (Keyhives CGKA) als reiner Schlüssel-Adapter, Mitgliedschaft kommt von außen"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
beekem = "=0.4.0"
keyhive_crypto = "=0.2.1"
future_form = "0.3"
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
hex = "0.4"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[workspace]
